name: UTM to Notion Registry

# Fired by the Link Registry tool via repository_dispatch (any event type).
# Appends one row to the Notion "UTM Link Registry" database.
# Requires the NOTION_TOKEN repo secret (a Notion internal integration secret
# whose integration has been given access to the database).

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      payload:
        description: "Test payload JSON (same shape as the tool's client_payload)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  append:
    runs-on: ubuntu-latest
    env:
      NOTION_DATABASE_ID: 4d95eb4ebf164662b65b0bfb33af212b
      PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.payload }}
    steps:
      - name: Log received payload keys
        run: |
          echo "event=${{ github.event_name }} type=${{ github.event.action }}"
          printf '%s' "$PAYLOAD" | jq -r 'if type == "object" then keys[] else "warning: payload is not a JSON object" end' || true

      - name: Append row to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN secret is not set (repo Settings > Secrets and variables > Actions)"
            exit 1
          fi

          BODY=$(printf '%s' "$PAYLOAD" | jq --arg db "$NOTION_DATABASE_ID" '
            def clean: if . == null or . == "" then null else tostring end;
            def sel:   clean | if . == null then null else {select: {name: .}} end;
            def urlp:  clean | if . == null then null else {url: .} end;
            def rich:  clean | if . == null then null else {rich_text: [{text: {content: .}}]} end;
            def datep: clean | if . == null then null else {date: {start: .}} end;
            (if type == "object" then . else {} end) as $p |
            {
              parent: {database_id: $db},
              properties: ({
                "utm_content":     {title: [{text: {content: (($p.utm_content // $p.utmContent // $p.content // "untitled") | tostring)}}]},
                "Tagged URL":      (($p.tagged_url // $p.taggedUrl // $p.tagged // $p.url) | urlp),
                "Destination":     (($p.destination // $p.destination_url // $p.destinationUrl // $p.base_url // $p.baseUrl) | urlp),
                "Source":          (($p.source // $p.utm_source) | sel),
                "Medium":          (($p.medium // $p.utm_medium) | sel),
                "Campaign":        (($p.campaign // $p.utm_campaign) | sel),
                "Account":         ($p.account | sel),
                "PostHog Project": (($p.posthog_project // $p.posthogProject // $p.project) | sel),
                "Status":          (($p.status // "generated") | sel),
                "Publish Date":    (($p.publish_date // $p.publishDate // $p.date) | datep),
                "Typefully Draft": (($p.typefully_draft // $p.typefullyDraft // $p.draft) | rich),
                "Notes":           ($p.notes | rich)
              } | with_entries(select(.value != null)))
            }')

          RESP=$(curl -sS -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data "$BODY")

          if [ "$(printf '%s' "$RESP" | jq -r '.object')" = "error" ]; then
            echo "::error::Notion API error: $(printf '%s' "$RESP" | jq -r '.message')"
            exit 1
          fi
          echo "Created Notion row: $(printf '%s' "$RESP" | jq -r '.url')"
